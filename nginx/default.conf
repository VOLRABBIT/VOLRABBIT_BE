# 1. HTTP -> HTTPS 자동 리다이렉트 (308 유지)
server {
    listen 80;
    listen [::]:80;
    server_name modotodo.co.kr www.modotodo.co.kr;

    return 308 https://$host$request_uri;
}

# 2. 메인 HTTPS 서버 설정
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modotodo.co.kr www.modotodo.co.kr;

    # ★ 클라우드플레어 인증서 경로 (서버에 생성한 파일)
    ssl_certificate /etc/nginx/cloudflare-cert.pem;
    ssl_certificate_key /etc/nginx/cloudflare-key.pem;

    # 보안 및 성능 설정
    server_tokens off;
    client_max_body_size 20M;

    # [프론트엔드 - React/Web]
    # 만약 프론트엔드 파일이 서버 /var/www/html에 있다면 유지, 없다면 API 전용으로 사용
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # [백엔드 API - Spring Boot]
    location /api {
        proxy_pass http://localhost:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # [Swagger & API Docs]
    location /swagger-ui {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }
}