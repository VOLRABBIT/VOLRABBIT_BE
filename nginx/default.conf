# 1. HTTP(80) -> HTTPS(443) 자동 리다이렉트
server {
    if ($host = www.modotodo.co.kr) {
        return 301 https://$host$request_uri;
    }
    if ($host = modotodo.co.kr) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name modotodo.co.kr www.modotodo.co.kr;
    return 404;
}

# 2. 메인 HTTPS 서버 설정
server {
    # [SSL 필수 설정] - 서버에 있던 Certbot 설정 내용을 가져옴
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name modotodo.co.kr www.modotodo.co.kr;

    # ★ 서버에 실제 존재하는 인증서 경로 (서버 코드 참고함)
    ssl_certificate /etc/letsencrypt/live/modotodo.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modotodo.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # [보안 및 성능 설정] - 로컬 코드 참고함
    server_tokens off;
    client_max_body_size 10M;

    # [프론트엔드 - React/Web]
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # [백엔드 API - Spring Boot]
    location /api {
        proxy_pass http://localhost:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # [Swagger]
    location /swagger-ui {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}