name: Deploy to Server

on:
  push:
    # 1. 이미지 빌드 설정
    # build: . 은 "현재 폴더에 있는 Dockerfile로 빌드해라"라는 뜻입니다.
    # (선택) 만약 도커 허브 이미지를 바로 쓸 거라면 build 대신 아래를 씁니다.
    # image: [본인_도커허브_아이디]/volrabbit-server

    # 2. 컨테이너 이름 (선택 사항)
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 체크아웃 및 자바 빌드
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. 배포 파일 패키징 (Jar + 설정파일)
      # .env는 서버에서 직접 만들 것이므로 포함하지 않습니다.
      - name: Make tar file
        run: tar -cvf deploy.tar docker-compose.yml Dockerfile build/libs/*.jar

      # 3. 서버로 파일 전송 (SCP)
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "deploy.tar"
          target: "/home/${{ secrets.USERNAME }}/app"

      # 4. 서버에 .env 파일 생성
      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        env:
          # 시크릿 연결 (이거 꼭 있어야 값 넘어갑니다!)
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          OAUTH2_CLIENT_ID: ${{ secrets.OAUTH2_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH2_CLIENT_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,PRIVATE_PEM,OAUTH2_CLIENT_ID,OAUTH2_CLIENT_SECRET
          script: |
            cd /home/${{ secrets.USERNAME }}/app

            cat > .env << EOF
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET_KEY="$PRIVATE_PEM"
            OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID
            OAUTH2_CLIENT_SECRET=$OAUTH2_CLIENT_SECRET
            EOF

      # 5. 배포 실행 (2번 스타일처럼 실행 단계 분리)
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/app
            
            # 압축 풀기
            tar -xvf deploy.tar

            # Docker Compose 재시작
            # (같은 폴더의 .env를 자동으로 읽습니다)
            docker-compose down
            docker-compose up -d --build
            
            # 청소
            rm deploy.tar
            docker image prune -f
