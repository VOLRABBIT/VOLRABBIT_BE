name: Deploy to Server

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Key 파일 생성 (필요하다면 유지, 필요 없다면 제거해도 됨)
      - name: Make key files
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          PUBLIC_PEM: ${{ secrets.PUBLIC_PEM }}
        run: |
          mkdir -p src/main/resources/keys
          if [ -n "$PRIVATE_PEM" ]; then echo "$PRIVATE_PEM" > src/main/resources/keys/private_key.pem; fi
          if [ -n "$PUBLIC_PEM" ]; then echo "$PUBLIC_PEM" > src/main/resources/keys/public_key.pem; fi

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # Docker 빌드에 필요한 파일 압축
      - name: Make tar file
        run: tar -cvf deploy.tar docker-compose.yml Dockerfile build/libs/*.jar

      # 서버로 파일 전송 (SCP)
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "deploy.tar"
          target: "/home/${{ secrets.USERNAME }}/app"

      # 배포 실행 (SSH)
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        env:
          # DB 관련
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          # 카카오
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}

          # 구글
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}

          # 애플
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
          APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,APPLE_CLIENT_ID,APPLE_CLIENT_SECRET,APPLE_REDIRECT_URI
          script: |
            set -e

            mkdir -p /home/${{ secrets.USERNAME }}/app
            cd /home/${{ secrets.USERNAME }}/app

            tar -xvf deploy.tar

            cat > .env << EOF
            # DB Configuration
            DB_HOST=db
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            
            JWT_PRIVATE_KEY_PATH=keys/private_key.pem
            JWT_PUBLIC_KEY_PATH=keys/public_key.pem
            
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI
            
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI
            
            APPLE_CLIENT_ID=$APPLE_CLIENT_ID
            APPLE_CLIENT_SECRET=$APPLE_CLIENT_SECRET
            APPLE_REDIRECT_URI=$APPLE_REDIRECT_URI
            EOF
            
            chmod 600 .env

            docker compose down
            docker compose build
            docker compose up -d

            rm deploy.tar
            docker image prune -f