name: Deploy to Server

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 체크아웃
      - uses: actions/checkout@v3

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradlew 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Key 파일 생성 (JWT용)
      - name: Make key files
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          PUBLIC_PEM: ${{ secrets.PUBLIC_PEM }}
        run: |
          mkdir -p src/main/resources/keys
          if [ -n "$PRIVATE_PEM" ]; then echo "$PRIVATE_PEM" > src/main/resources/keys/private.pem; fi
          if [ -n "$PUBLIC_PEM" ]; then echo "$PUBLIC_PEM" > src/main/resources/keys/public.pem; fi

      # 5. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 배포 파일 압축
      - name: Make tar file
        run: tar -cvf deploy.tar docker-compose.yml Dockerfile build/libs/*.jar

      # 7. 서버로 파일 전송 (SCP)
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "deploy.tar"
          target: "/home/${{ secrets.USERNAME }}/app"

      # 8. 서버에서 배포 실행 (SSH)
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        env:
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          
          # OAuth2 Secrets
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          
          # AWS Secrets
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_REGION: 'ap-northeast-2'
        
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # envs에 나열된 변수들을 script로 넘김
          envs: DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,PRIVATE_PEM,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_REDIRECT_URI,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET_NAME,AWS_REGION
          script: |
            mkdir -p /home/${{ secrets.USERNAME }}/app
            cd /home/${{ secrets.USERNAME }}/app

            # 1. 압축 풀기
            tar -xvf deploy.tar

            # 2. .env 파일 생성 (도커 컨테이너가 읽을 파일)
            cat > .env << EOF
            # DB 설정 (Docker 내부 통신이므로 host는 db)
            DB_HOST=db
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            
            # JWT 설정
            JWT_SECRET_KEY="$PRIVATE_PEM"
            
            # OAuth2 설정
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            NAVER_REDIRECT_URI=$NAVER_REDIRECT_URI
            
            # AWS 설정
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
            AWS_REGION=$AWS_REGION
            EOF
            
            chmod 600 .env

            # 3. 도커 재실행
            docker compose down
            docker compose up -d --build

            # 4. 청소
            rm deploy.tar
            docker image prune -f