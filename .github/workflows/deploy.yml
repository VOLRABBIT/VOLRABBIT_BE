name: Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 체크아웃 및 자바 빌드
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. 배포 파일 패키징 (Jar + 설정파일)
      # .env는 서버에서 직접 만들 것이므로 포함하지 않습니다.
      - name: Make tar file
        run: tar -cvf deploy.tar docker-compose.yml Dockerfile build/libs/*.jar

      # 3. 서버로 파일 전송 (SCP)
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "deploy.tar"
          target: "/home/${{ secrets.USERNAME }}/app"

      # 4. 서버에 .env 파일 생성 (2번 스타일 적용!)
      # 여기서 환경변수를 관리하면 나중에 추가/삭제가 매우 편해집니다.
      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # [핵심] 여기에 사용할 시크릿을 등록합니다.
          envs: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
          script: |
            cd /home/${{ secrets.USERNAME }}/app

            cat > .env << EOF
            DATABASE_URL=$DATABASE_URL
            DATABASE_USERNAME=$DATABASE_USERNAME
            DATABASE_PASSWORD=$DATABASE_PASSWORD
            EOF
            
            echo ".env created."

      # 5. 배포 실행 (2번 스타일처럼 실행 단계 분리)
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/app
            
            # 압축 풀기
            tar -xvf deploy.tar
            
            # Docker Compose 재시작
            # (같은 폴더의 .env를 자동으로 읽습니다)
            docker-compose down
            docker-compose up -d --build
            
            # 청소
            rm deploy.tar
            docker image prune -f