version: '3.8'

services:
  app:
    container_name: volrabbit-backend
    image: volrabbit-backend:latest
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      TZ: Asia/Seoul
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"